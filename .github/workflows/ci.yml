name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks and builds before it signs.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit hashes so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The integration tests only run in a VM, but they must keep compiling.
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run check
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: internal/webui/build/ui
          if-no-files-found: error

  # Installs the last release, gives it something to keep, and updates it to
  # this commit the way the panel does. A release that would lose data or
  # not come up on an existing server stops here.
  upgrade:
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: internal/webui/build/ui
      - name: Install the last release
        run: |
          # Behind a tunnel the installer wants a connector running; a
          # stand-in does, since nothing here comes from outside.
          printf '[Service]\nExecStart=/bin/sleep infinity\n' | sudo tee /etc/systemd/system/cloudflared.service
          sudo systemctl daemon-reload
          sudo systemctl start cloudflared
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" |
            sudo sh -s -- --mode tunnel --host panel.upgrade.test
      - name: Build this commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          old=$(zelie version | awk '{print $2}')
          # Outside a release, the version after the installed one.
          new=${VERSION:-${old%.*}.$((${old##*.} + 1))}
          echo "OLD=$old" >> "$GITHUB_ENV"
          echo "NEW=$new" >> "$GITHUB_ENV"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/Caria-Core/zelie/internal/version.Version=$new" -o zelie-new ./cmd/zelie
          go build -o upgrade ./hack/upgrade
      - name: Seed
        run: sudo ./upgrade seed
      - name: Update
        # What the running version's core does once it has checked a release.
        run: |
          sudo cp /usr/local/bin/zelie /usr/local/bin/zelie.old
          sudo install -m 755 zelie-new /usr/local/bin/zelie
          sudo systemd-run --unit zelie-update --collect --wait --quiet \
            /usr/local/bin/zelie.old update-finish --from "$OLD" --to "$NEW"
      - name: Check
        run: sudo ./upgrade check -want "$NEW"
      - name: Logs
        if: failure()
        run: sudo journalctl -u zelie-core -u zelie-proxy -u zelie-panel -u zelie-update --no-pager | tail -n 300

  build:
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: internal/webui/build/ui
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version || 'dev' }}
        run: go build -trimpath -ldflags "-X github.com/Caria-Core/zelie/internal/version.Version=$VERSION" -o zelie-linux-${{ matrix.arch }} ./cmd/zelie
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zelie-linux-${{ matrix.arch }}
          path: zelie-linux-${{ matrix.arch }}
          if-no-files-found: error
