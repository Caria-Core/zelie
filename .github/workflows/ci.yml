name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks and builds before it signs.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit hashes so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The integration tests only run in a VM, but they must keep compiling.
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  # Downloads every egg of the catalog at its pinned commit and checks that
  # Zelie can make a server from it: it parses, its startup command and
  # settings are filled in, and its defaults pass its own rules. A catalog
  # entry that breaks fails here instead of on someone's server.
  eggs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags eggcheck -run TestCatalogEggs -v ./internal/panel

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run check
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: internal/webui/build/ui
          if-no-files-found: error

  # Installs a release, gives it something to keep, and updates it to this
  # commit the way the panel does. A release that would lose data or not
  # come up on an existing server stops here. From the last release, the
  # usual step, and from the first that can update itself, the longest.
  upgrade:
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: [latest, v0.2.0]
    name: upgrade from ${{ matrix.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: internal/webui/build/ui
      - name: Install the release
        env:
          FROM: ${{ matrix.from }}
        run: |
          # Behind a tunnel the installer wants a connector running; a
          # stand-in does, since nothing here comes from outside.
          printf '[Service]\nExecStart=/bin/sleep infinity\n' | sudo tee /etc/systemd/system/cloudflared.service
          sudo systemctl daemon-reload
          sudo systemctl start cloudflared
          if [ "$FROM" = latest ]; then
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" |
              sudo sh -s -- --mode tunnel --host panel.upgrade.test
          else
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$FROM/install.sh" |
              sudo ZELIE_VERSION="$FROM" sh -s -- --mode tunnel --host panel.upgrade.test
          fi
      - name: Build this commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(zelie version | awk '{print $2}')
          # Outside a release, a version after the latest one.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          new=${VERSION:-${latest%.*}.$((${latest##*.} + 1))}
          echo "OLD=$old" >> "$GITHUB_ENV"
          echo "NEW=$new" >> "$GITHUB_ENV"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/Caria-Core/zelie/internal/version.Version=$new" -o zelie-new ./cmd/zelie
          go build -o upgrade ./hack/upgrade
      - name: Seed
        run: sudo ./upgrade seed
      - name: Trace the collector
        # Each collection logs the live heap, its goal, stacks and globals,
        # which the footprint alone does not show.
        run: |
          for u in zelie-core zelie-panel zelie-proxy; do
            sudo mkdir -p /etc/systemd/system/$u.service.d
            printf '[Service]\nEnvironment=GODEBUG=gctrace=1\n' |
              sudo tee /etc/systemd/system/$u.service.d/gctrace.conf
          done
          sudo systemctl daemon-reload
      - name: Update
        # What the running version's core does once it has checked a release.
        run: |
          sudo cp /usr/local/bin/zelie /usr/local/bin/zelie.old
          sudo install -m 755 zelie-new /usr/local/bin/zelie
          sudo systemd-run --unit zelie-update --collect --wait --quiet \
            /usr/local/bin/zelie.old update-finish --from "$OLD" --to "$NEW"
      - name: Check
        run: sudo ./upgrade check -want "$NEW"
      # A real Paper server on the updated panel. Once is enough, so the run
      # from the oldest release stays short.
      - name: Footprint
        # Zelie's own memory once the update settled, apps and databases not
        # counted; and the size of the binary.
        env:
          # Idle, with a few apps and databases running. The runner measured
          # 70 MB once huge pages were kept out (85 to 89 MB before); this
          # keeps it from creeping back up.
          MAX_PSS_MB: 78
        run: |
          # RSS counts the binary's shared pages once per process; PSS splits them.
          measure() {
            ps -C zelie -o pid=,rss=,args=
            for p in $(pgrep -x zelie); do
              sudo awk -v p="$p" '/^(Pss|Private_Dirty|Private_Clean|AnonHugePages):/ {v[$1]=$2} END {printf "%s pss=%d private=%d hugepages=%d kB\n", p, v["Pss:"], v["Private_Dirty:"]+v["Private_Clean:"], v["AnonHugePages:"]}' /proc/$p/smaps_rollup
            done
          }
          # The processes hand free memory back every half minute, so a single
          # reading lands before or after that at random: the same commit read
          # 80 and 91 MB. Five readings over 90 seconds are printed and the
          # limit applies to the lowest, which is the idle footprint.
          cat /sys/kernel/mm/transparent_hugepage/enabled
          sleep 20
          best=
          for i in 1 2 3 4 5; do
            echo "== reading $i"
            total=$(measure | tee /dev/stderr | awk '/pss=/ {split($2,a,"="); t+=a[2]} END {printf "%.1f", t/1024}')
            echo "zelie total pss: $total MB"
            best=$(awk -v a="$best" -v b="$total" 'BEGIN {print (a == "" || b < a) ? b : a}')
            if [ "$i" -lt 5 ]; then sleep 18; fi
          done
          echo "lowest of five: $best MB (limit $MAX_PSS_MB MB)"
          ls -l /usr/local/bin/zelie
          for u in zelie-core zelie-panel zelie-proxy; do
            echo "== $u"
            sudo journalctl -u $u --since "-100s" --no-pager -o cat | grep '^gc ' || true
          done
          awk -v t="$best" -v max="$MAX_PSS_MB" 'BEGIN { if (t > max) { print "zelie uses more memory than its limit"; exit 1 } }'
      - name: Game server
        if: matrix.from == 'latest'
        run: sudo ./upgrade game
      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u zelie-core -u zelie-proxy -u zelie-panel -u zelie-sftp -u zelie-sftp.socket -u zelie-update --no-pager | tail -n 300
          # What game server containers printed, and what their volumes hold.
          sudo find /var/lib/zelie -type f -name 'paper-*.log' 2>/dev/null |
            while read -r f; do echo "== $f"; sudo tail -n 60 "$f"; done
          sudo find /var/lib -maxdepth 6 -type d -name 'vol-*' 2>/dev/null |
            while read -r d; do echo "== $d"; sudo ls -la "$d"; done

  build:
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: internal/webui/build/ui
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version || 'dev' }}
        run: go build -trimpath -ldflags "-X github.com/Caria-Core/zelie/internal/version.Version=$VERSION" -o zelie-linux-${{ matrix.arch }} ./cmd/zelie
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zelie-linux-${{ matrix.arch }}
          path: zelie-linux-${{ matrix.arch }}
          if-no-files-found: error
